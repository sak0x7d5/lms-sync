<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="300" rx="12" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
  <!-- LMS -->
  <rect x="20" y="40" width="170" height="220" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="105" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Your LMS</text>
  <text x="105" y="86" text-anchor="middle" font-size="11" fill="#59636e">Sakai, behind a login</text>
  <g font-size="12" fill="#1f2328">
    <text x="40" y="112">Resources</text><text x="40" y="132">Overview</text><text x="40" y="152">Syllabus</text>
    <text x="40" y="172">Announcements</text><text x="40" y="192">Assignments</text><text x="40" y="212">Calendar</text>
    <text x="40" y="232">Drop Box</text>
  </g>
  <line x1="190" y1="150" x2="248" y2="150" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <text x="219" y="140" text-anchor="middle" font-size="11" fill="#59636e">sync</text>
  <!-- lms-sync -->
  <rect x="252" y="40" width="250" height="220" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="377" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">lms-sync</text>
  <text x="377" y="86" text-anchor="middle" font-size="11" fill="#59636e">one binary, on your machine</text>
  <rect x="272" y="102" width="210" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="377" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Your library</text>
  <text x="377" y="137" text-anchor="middle" font-size="11" fill="#59636e">slides, PDFs, saved pages</text>
  <line x1="377" y1="146" x2="377" y2="166" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="272" y="170" width="210" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="377" y="189" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Search index</text>
  <text x="377" y="205" text-anchor="middle" font-size="11" fill="#59636e">text from pptx, docx, xlsx, PDF</text>
  <text x="377" y="240" text-anchor="middle" font-size="11" fill="#59636e">+ your quiz history</text>
  <line x1="502" y1="150" x2="560" y2="150" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
  <text x="531" y="140" text-anchor="middle" font-size="11" fill="#59636e">MCP</text>
  <!-- Assistant -->
  <rect x="564" y="40" width="176" height="220" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="652" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Your assistant</text>
  <text x="652" y="86" text-anchor="middle" font-size="11" fill="#59636e">Claude, Cursor, opencode</text>
  <g font-size="11.5" fill="#1f2328" font-style="italic">
    <text x="580" y="122">"What's on Thursday's</text><text x="580" y="138">quiz?"</text>
    <text x="580" y="170">"When is the</text><text x="580" y="186">assignment due?"</text>
    <text x="580" y="218">"Quiz me on</text><text x="580" y="234">chapter 3."</text>
  </g>
</svg>
