<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="300" rx="12" fill="#0d1117"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs>
  <!-- LMS -->
  <rect x="20" y="40" width="170" height="220" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="105" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Your LMS</text>
  <text x="105" y="86" text-anchor="middle" font-size="11" fill="#9198a1">Sakai, behind a login</text>
  <g font-size="12" fill="#e6edf3">
    <text x="40" y="116">Resources</text><text x="40" y="139">Overview</text><text x="40" y="162">Syllabus</text>
    <text x="40" y="185">Announcements</text><text x="40" y="208">Assignments</text><text x="40" y="231">Drop Box</text>
  </g>
  <line x1="190" y1="150" x2="248" y2="150" stroke="#9198a1" stroke-width="2" marker-end="url(#a)"/>
  <text x="219" y="140" text-anchor="middle" font-size="11" fill="#9198a1">sync</text>
  <!-- lms-sync -->
  <rect x="252" y="40" width="250" height="220" rx="10" fill="#0c2d6b" stroke="#4493f8" stroke-width="2"/>
  <text x="377" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">lms-sync</text>
  <text x="377" y="86" text-anchor="middle" font-size="11" fill="#9198a1">one binary, on your machine</text>
  <rect x="272" y="102" width="210" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="377" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">Your library</text>
  <text x="377" y="137" text-anchor="middle" font-size="11" fill="#9198a1">slides, PDFs, saved pages</text>
  <line x1="377" y1="146" x2="377" y2="166" stroke="#9198a1" stroke-width="2" marker-end="url(#a)"/>
  <rect x="272" y="170" width="210" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="377" y="189" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">Search index</text>
  <text x="377" y="205" text-anchor="middle" font-size="11" fill="#9198a1">text from pptx, docx, xlsx, PDF</text>
  <text x="377" y="240" text-anchor="middle" font-size="11" fill="#9198a1">+ your quiz history</text>
  <line x1="502" y1="150" x2="560" y2="150" stroke="#9198a1" stroke-width="2" marker-end="url(#a)"/>
  <text x="531" y="140" text-anchor="middle" font-size="11" fill="#9198a1">MCP</text>
  <!-- Assistant -->
  <rect x="564" y="40" width="176" height="220" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="652" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Your assistant</text>
  <text x="652" y="86" text-anchor="middle" font-size="11" fill="#9198a1">Claude, Cursor, opencode</text>
  <g font-size="11.5" fill="#e6edf3" font-style="italic">
    <text x="580" y="122">"What's on Thursday's</text><text x="580" y="138">quiz?"</text>
    <text x="580" y="170">"When is the</text><text x="580" y="186">assignment due?"</text>
    <text x="580" y="218">"Quiz me on</text><text x="580" y="234">chapter 3."</text>
  </g>
</svg>
