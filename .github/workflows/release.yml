name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          # Windows 10 on ARM emulates 32-bit x86 only, so the amd64 build
          # genuinely will not start there. CGO is off below, so this costs
          # nothing but a matrix line.
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: darwin,  goarch: arm64, ext: '' }
          - { goos: darwin,  goarch: amd64, ext: '' }
          - { goos: linux,   goarch: amd64, ext: '' }
          # arm64 covers a Raspberry Pi or an ARM server running Debian, and
          # Termux on Android: Termux is a Linux userland, so the static
          # linux/arm64 binary is the one a phone runs. CGO_ENABLED=0 below is
          # what makes it static, and so independent of Android's libc.
          - { goos: linux,   goarch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          # A tagged build reports the tag; a manual run reports the commit,
          # so a dispatch artifact can never be mistaken for a release.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          out=lms-sync-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$out" .
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Checked out into a subdirectory on purpose: actions/checkout cleans
      # the path it is given, and at the repository root that would delete
      # the dist/ the artifacts land in.
      - uses: actions/checkout@v4
        with: { path: repo }

      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      # The installers ship with the release they install, rather than being
      # fetched from a branch: one host to reach on a locked-down campus
      # network, and a copy that cannot drift from the binaries beside it.
      # They are checksummed below too, so the script itself can be verified.
      - name: Add the installers
        run: cp repo/install.sh repo/install.ps1 dist/

      # Named after what reads it: `sha256sum -c` on Linux and
      # `shasum -a 256 -c` on a Mac take the same format. Generated from
      # inside dist/ so every name in it is bare, the way the asset is
      # actually downloaded. The files are listed rather than globbed so
      # SHA256SUMS can never end up listing itself.
      - name: Checksums
        working-directory: dist
        run: sha256sum lms-sync-* install.sh install.ps1 > SHA256SUMS

      # A tag with a hyphen in it — v1.3.0-rc1, -beta, -alpha — is marked a
      # prerelease, which is what keeps it out of /releases/latest. Without
      # this, cutting a release candidate quietly repoints every install
      # one-liner in the README at it, and the first thing anyone testing an
      # rc would install is the rc.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Runs the installer that was just published, on one runner per target it
  # claims to support. Nothing else ever executes these scripts against a real
  # release: CI can only parse them.
  #
  # After publish rather than before, because a draft release's assets are not
  # reachable at the public /releases/download/ URLs without a token — so a
  # verify job gated on a draft could not exercise the path a student takes.
  # The cost is that a failure here means re-cutting the tag, which is why
  # cutting an -rc tag first is worth the minute it takes.
  #
  # windows/arm64 is built but has no leg: there is no ARM Windows runner
  # dependable enough to gate a release on. It is covered by the cross-compile
  # check in ci.yml only.
  verify:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux/amd64 }
          - { os: ubuntu-24.04-arm, target: linux/arm64 }
          - { os: macos-latest,     target: darwin/arm64 }
          - { os: macos-13,         target: darwin/amd64 }
          - { os: windows-latest,   target: windows/amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install and check (${{ matrix.target }})
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          base="https://github.com/$REPO/releases/download/$TAG"
          # The tag explicitly, never "latest": re-tagging an older version
          # must not quietly test a different release than the one just built.
          curl -fsSL "$base/install.sh" -o install.sh

          # --version pins the tag being verified. Without it the installer
          # resolves /releases/latest, which is a different release than this
          # one whenever this tag is a prerelease — so an rc would verify the
          # last stable build and report success without ever having run the
          # thing being released.
          sh install.sh --version "$TAG"
          export PATH="$HOME/.local/bin:$PATH"

          got=$(lms-sync --version)
          want="lms-sync ${TAG#v}"
          if [ "$got" != "$want" ]; then
            echo "expected '$want', got '$got'"; exit 1
          fi

          # The invariant the whole layout exists for: run through the symlink
          # on PATH, the tool must still resolve its config beside the real
          # binary. --extract needs no network and no config to say so.
          out=$(lms-sync --extract 2>&1 || true)
          case "$out" in
          *"$HOME/.local/share/lms-sync/config.toml"*) ;;
          *) echo "config did not resolve to the install dir:"; echo "$out"; exit 1 ;;
          esac
          case "$out" in
          *"$HOME/.local/bin/config.toml"*)
            echo "config resolved next to the symlink — the layout is broken"; exit 1 ;;
          esac

          marks() {
            cat "$HOME/.profile" "$HOME/.bashrc" "$HOME/.bash_profile" \
                "$HOME/.zshrc" 2>/dev/null | grep -c 'lms-sync installer' || true
          }
          before=$(marks)
          sh install.sh --version "$TAG"
          if [ "$(marks)" != "$before" ]; then
            echo "a second run changed the profiles: $before then $(marks)"; exit 1
          fi

          # Uninstall must not take the credentials with it.
          echo "password = 'x'" > "$HOME/.local/share/lms-sync/config.toml"
          sh install.sh --uninstall
          if [ ! -f "$HOME/.local/share/lms-sync/config.toml" ]; then
            echo "uninstall deleted config.toml"; exit 1
          fi
          if [ -e "$HOME/.local/bin/lms-sync" ]; then
            echo "uninstall left the symlink"; exit 1
          fi
          echo "ok ${{ matrix.target }}"

      - name: Install and check (${{ matrix.target }})
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $url = "https://github.com/$env:REPO/releases/download/$env:TAG/install.ps1"
          # The documented form, so what is tested is what the README says.
          # -Version pins the tag under test: without it the installer resolves
          # /releases/latest, which is never this tag when this tag is a
          # prerelease.
          & ([scriptblock]::Create((Invoke-WebRequest -Uri $url -UseBasicParsing).Content)) -Version $env:TAG

          # Rebuilt from the registry rather than trusted from the session:
          # this is the real check that the *user* PATH got the entry.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                      [Environment]::GetEnvironmentVariable('Path', 'User')

          $got = (& lms-sync --version | Out-String).Trim()
          $want = "lms-sync " + $env:TAG.TrimStart('v')
          if ($got -ne $want) { throw "expected '$want', got '$got'" }

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\lms-sync'
          $out = (& lms-sync --extract 2>&1 | Out-String)
          if ($out -notlike "*$(Join-Path $dir 'config.toml')*") {
            throw "config did not resolve to the install dir: $out"
          }

          & ([scriptblock]::Create((Invoke-WebRequest -Uri $url -UseBasicParsing).Content)) -Version $env:TAG

          Set-Content -Path (Join-Path $dir 'config.toml') -Value "password = 'x'"
          & ([scriptblock]::Create((Invoke-WebRequest -Uri $url -UseBasicParsing).Content)) -Uninstall
          if (-not (Test-Path (Join-Path $dir 'config.toml'))) { throw 'uninstall deleted config.toml' }
          if (Test-Path (Join-Path $dir 'lms-sync.exe')) { throw 'uninstall left the exe' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -and $userPath.ToLower().Contains($dir.ToLower())) {
            throw 'uninstall left the PATH entry'
          }
          Write-Host "ok ${{ matrix.target }}"
